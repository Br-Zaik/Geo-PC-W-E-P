name: Crear Geo Office AI EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar y descomprimir ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "GeoOfficeAI*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$zip) {
            throw "No se encontró ningún ZIP GeoOfficeAI en el repositorio."
          }

          Write-Host "Usando ZIP: $($zip.Name)"

          New-Item -ItemType Directory -Force extracted | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force

          $solution = Get-ChildItem extracted -Filter "GeoOfficeAI.sln" -Recurse |
            Select-Object -First 1

          if (!$solution) {
            throw "No se encontró GeoOfficeAI.sln dentro del ZIP."
          }

          $root = $solution.Directory.FullName

          Write-Host "Proyecto encontrado en: $root"

          "PROJECT_ROOT=$root" >> $env:GITHUB_ENV

      - name: Preparar Visual Studio y VSTO
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "Visual Studio no está disponible."
          }

          $install = & $vswhere -latest -products * -property installationPath

          if ([string]::IsNullOrWhiteSpace($install)) {
            throw "No se encontró Visual Studio."
          }

          Write-Host "Visual Studio encontrado en:"
          Write-Host $install

          $targets = Join-Path $install "MSBuild\Microsoft\VisualStudio\v17.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"

          if (!(Test-Path $targets)) {
            Write-Host "Instalando herramientas Office/VSTO..."

            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

            & $setup modify `
              --installPath $install `
              --add Microsoft.VisualStudio.Workload.Office `
              --includeRecommended `
              --quiet `
              --norestart

            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
              throw "No se pudo instalar Office/VSTO."
            }
          }

          Write-Host "Visual Studio/VSTO preparado."

      - name: Colocar inicio de sesión Google
        shell: pwsh
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_JSON)) {
            throw "Falta configurar GOOGLE_OAUTH_JSON en GitHub Secrets."
          }

          $folder = Join-Path $env:PROJECT_ROOT "GeoOfficeAI.Broker"

          if (!(Test-Path $folder)) {
            throw "No se encontró la carpeta GeoOfficeAI.Broker."
          }

          $file = Join-Path $folder "google_oauth.json"

          [IO.File]::WriteAllText(
            $file,
            $env:GOOGLE_OAUTH_JSON,
            [Text.Encoding]::UTF8
          )

          if (!(Test-Path $file)) {
            throw "No se pudo crear google_oauth.json."
          }

          Write-Host "OAuth de Google configurado correctamente."

      - name: Compilar Geo Office AI
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT

          if (!(Test-Path ".\build.ps1")) {
            throw "No se encontró build.ps1."
          }

          Write-Host "Iniciando compilación..."

          .\build.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "La compilación de Geo Office AI falló."
          }

          Write-Host "Compilación terminada."

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo instalar Inno Setup."
          }

          Write-Host "Inno Setup instalado."

      - name: Crear instalador EXE
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "No se encontró ISCC.exe de Inno Setup."
          }

          $script = "installer\GeoOfficeAI.iss"

          if (!(Test-Path $script)) {
            throw "No se encontró installer\GeoOfficeAI.iss."
          }

          & $iscc $script

          if ($LASTEXITCODE -ne 0) {
            throw "Falló la creación del instalador EXE."
          }

      - name: Buscar EXE generado
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path $env:PROJECT_ROOT -Filter "*.exe" -Recurse |
            Where-Object {
              $_.Name -like "*GeoOfficeAI*Setup*" -or
              $_.Name -like "*GeoOfficeAI*"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$exe) {
            throw "No se encontró ningún instalador EXE generado."
          }

          Write-Host "EXE encontrado:"
          Write-Host $exe.FullName

          "INSTALLER_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: GeoOfficeAI-Windows-Installer
          path: ${{ env.INSTALLER_EXE }}
          if-no-files-found: error
