name: Crear Geo Office AI EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar y descomprimir ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem -Path . -Filter "GeoOfficeAI*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$zip) {
            throw "No se encontró ningún ZIP GeoOfficeAI."
          }

          Write-Host "Usando ZIP: $($zip.Name)"

          Remove-Item extracted -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force extracted | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force

          $solution = Get-ChildItem -Path extracted -Filter "GeoOfficeAI.sln" -Recurse |
            Select-Object -First 1

          if (!$solution) {
            throw "No se encontró GeoOfficeAI.sln dentro del ZIP."
          }

          $root = $solution.Directory.FullName
          "PROJECT_ROOT=$root" >> $env:GITHUB_ENV

          Write-Host "Proyecto encontrado: $root"

      - name: Preparar Visual Studio y VSTO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "No se encontró Visual Studio."
          }

          $install = & $vswhere -latest -products * -property installationPath

          if ([string]::IsNullOrWhiteSpace($install)) {
            throw "Visual Studio no está instalado."
          }

          $targets = Join-Path $install "MSBuild\Microsoft\VisualStudio\v17.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"

          if (!(Test-Path $targets)) {
            Write-Host "Instalando herramientas Office/VSTO..."

            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

            & $setup modify `
              --installPath $install `
              --add Microsoft.VisualStudio.Workload.Office `
              --includeRecommended `
              --quiet `
              --norestart

            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
              throw "No se pudo instalar VSTO."
            }
          }

          Write-Host "Visual Studio/VSTO listo."

      - name: Colocar inicio de sesión Google
        shell: pwsh
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_JSON)) {
            throw "Falta GOOGLE_OAUTH_JSON en GitHub Secrets."
          }

          $folder = Join-Path $env:PROJECT_ROOT "GeoOfficeAI.Broker"

          if (!(Test-Path $folder)) {
            throw "No existe GeoOfficeAI.Broker."
          }

          $file = Join-Path $folder "google_oauth.json"

          [IO.File]::WriteAllText(
            $file,
            $env:GOOGLE_OAUTH_JSON,
            [Text.Encoding]::UTF8
          )

          Write-Host "Google OAuth configurado."

      - name: Preparar firma VSTO correctamente
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Geo Office AI VSTO Build" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(3)

          if (!$cert) {
            throw "No se pudo crear el certificado VSTO."
          }

          $thumb = $cert.Thumbprint
          "VSTO_CERT_THUMBPRINT=$thumb" >> $env:GITHUB_ENV

          Write-Host "Certificado creado: $thumb"

          $projects = @(
            (Join-Path $env:PROJECT_ROOT "GeoOfficeAI.Word\GeoOfficeAI.Word.csproj"),
            (Join-Path $env:PROJECT_ROOT "GeoOfficeAI.Excel\GeoOfficeAI.Excel.csproj"),
            (Join-Path $env:PROJECT_ROOT "GeoOfficeAI.PowerPoint\GeoOfficeAI.PowerPoint.csproj")
          )

          foreach ($project in $projects) {
            if (!(Test-Path $project)) {
              throw "No existe: $project"
            }

            [xml]$xml = Get-Content -Path $project -Raw

            $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
            $ns.AddNamespace("m", "http://schemas.microsoft.com/developer/msbuild/2003")

            $signNode = $xml.SelectSingleNode("//m:SignManifests", $ns)

            if ($null -eq $signNode) {
              throw "El proyecto no contiene SignManifests: $project"
            }

            $group = $signNode.ParentNode
            $signNode.InnerText = "true"

            function Set-PropertyNode {
              param(
                [System.Xml.XmlDocument]$Document,
                [System.Xml.XmlElement]$PropertyGroup,
                [string]$Name,
                [string]$Value
              )

              $node = $PropertyGroup.SelectSingleNode(
                "m:$Name",
                $ns
              )

              if ($null -eq $node) {
                $node = $Document.CreateElement(
                  $Name,
                  "http://schemas.microsoft.com/developer/msbuild/2003"
                )
                [void]$PropertyGroup.AppendChild($node)
              }

              $node.InnerText = $Value
            }

            Set-PropertyNode $xml $group "GenerateManifests" "true"
            Set-PropertyNode $xml $group "SignManifests" "true"
            Set-PropertyNode $xml $group "ManifestCertificateThumbprint" $thumb
            Set-PropertyNode $xml $group "CertificateThumbprint" $thumb

            $xml.Save($project)

            [xml]$check = Get-Content -Path $project -Raw

            $checkNs = New-Object System.Xml.XmlNamespaceManager($check.NameTable)
            $checkNs.AddNamespace("m", "http://schemas.microsoft.com/developer/msbuild/2003")

            $manifestThumb = $check.SelectSingleNode("//m:ManifestCertificateThumbprint", $checkNs)
            $certificateThumb = $check.SelectSingleNode("//m:CertificateThumbprint", $checkNs)
            $signCheck = $check.SelectSingleNode("//m:SignManifests", $checkNs)

            if ($null -eq $manifestThumb -or $manifestThumb.InnerText -ne $thumb) {
              throw "ManifestCertificateThumbprint no quedó configurado en $project"
            }

            if ($null -eq $certificateThumb -or $certificateThumb.InnerText -ne $thumb) {
              throw "CertificateThumbprint no quedó configurado en $project"
            }

            if ($null -eq $signCheck -or $signCheck.InnerText -ne "true") {
              throw "SignManifests no quedó activado en $project"
            }

            Write-Host "Firma VSTO correcta: $project"
          }

      - name: Compilar Geo Office AI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_ROOT

          if (!(Test-Path ".\build.ps1")) {
            throw "No existe build.ps1."
          }

          .\build.ps1

          Write-Host "Compilación terminada."

      - name: Comprobar archivos VSTO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
            (Join-Path $env:PROJECT_ROOT "dist\package\Word\GeoOfficeAI.Word.vsto"),
            (Join-Path $env:PROJECT_ROOT "dist\package\Excel\GeoOfficeAI.Excel.vsto"),
            (Join-Path $env:PROJECT_ROOT "dist\package\PowerPoint\GeoOfficeAI.PowerPoint.vsto")
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Falta archivo VSTO: $file"
            }

            Write-Host "OK: $file"
          }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo instalar Inno Setup."
          }

      - name: Crear instalador EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_ROOT

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "No se encontró Inno Setup."
          }

          $script = "installer\GeoOfficeAI.iss"

          if (!(Test-Path $script)) {
            throw "No existe installer\GeoOfficeAI.iss."
          }

          & $iscc $script

          if ($LASTEXITCODE -ne 0) {
            throw "Falló la creación del instalador."
          }

      - name: Buscar instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dist = Join-Path $env:PROJECT_ROOT "dist"

          $exe = Get-ChildItem `
            -Path $dist `
            -Filter "GeoOfficeAI-Setup*.exe" `
            -File `
            -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$exe) {
            throw "No apareció GeoOfficeAI-Setup.exe."
          }

          "INSTALLER_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "EXE creado: $($exe.FullName)"

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: GeoOfficeAI-Windows-Installer
          path: ${{ env.INSTALLER_EXE }}
          if-no-files-found: error

      - name: Limpiar certificado temporal
        if: always()
        shell: pwsh
        run: |
          if (![string]::IsNullOrWhiteSpace($env:VSTO_CERT_THUMBPRINT)) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:VSTO_CERT_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }
